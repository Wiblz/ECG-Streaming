name: ecg-streaming-prod

# Docker Compose - Production Environment
# Uses optimized builds, named volumes, no hot reload
#
# Usage:
#   ./stack.sh build-prod      # Build production images
#   ./stack.sh up-prod         # Start with BLE collector
#   ./stack.sh up-prod-usb     # Start with USB collector
#   ./stack.sh up-prod-agg     # Aggregator + frontend only

services:
  aggregator:
    image: ecg-streaming-aggregator:prod
    build:
      context: .
      dockerfile: docker/Dockerfile.aggregator
    container_name: ecg-aggregator-prod
    ports:
      - "50051:50051"
      - "7999:7999"
    volumes:
      - ./data:/data
      - ./packages/ecg-aggregator/config.yaml:/app/config.yaml:ro
      - ./logs:/logs:rw
    environment:
      - PYTHONUNBUFFERED=1
      - ECG_AGGREGATOR_STORAGE__DATABASE_PATH=/data/ecg_data.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect(('localhost', 50051)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  collector-ble:
    image: ecg-streaming-collector:prod
    build:
      context: .
      dockerfile: docker/Dockerfile.collector
    container_name: ecg-collector-ble-prod
    profiles:
      - ble
    depends_on:
      aggregator:
        condition: service_healthy
    network_mode: host
    privileged: true
    volumes:
      - ./packages/ecg-collector/config.yaml:/app/config.yaml:ro
      - /var/run/dbus:/var/run/dbus:ro
      - ./logs:/logs:rw
    environment:
      - PYTHONUNBUFFERED=1
      - ECG_COLLECTOR_AGGREGATOR__HOST=localhost
    command: ["ecg-collector", "ble", "run", "--config", "/app/config.yaml"]
    restart: unless-stopped

  collector-usb:
    image: ecg-streaming-collector:prod
    build:
      context: .
      dockerfile: docker/Dockerfile.collector
    container_name: ecg-collector-usb-prod
    profiles:
      - usb
    depends_on:
      aggregator:
        condition: service_healthy
    privileged: true
    volumes:
      - ./packages/ecg-collector/config.yaml:/app/config.yaml:ro
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /var/run/dbus:/var/run/dbus:ro
      - ./logs:/logs:rw
    environment:
      - PYTHONUNBUFFERED=1
    command: ["ecg-collector", "usb", "run", "--config", "/app/config.yaml"]
    restart: unless-stopped

  frontend:
    image: ecg-streaming-frontend:prod
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ecg-frontend-prod
    depends_on:
      - aggregator
    ports:
      - "4173:4173"
    environment:
      - NODE_ENV=production
      - PUBLIC_AGGREGATOR_URL=http://localhost:7999
    restart: unless-stopped

networks:
  default:
    name: ecg-network-prod
