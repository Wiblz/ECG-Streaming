[project]
name = "ecg-collector"
version = "0.1.0"
description = "Collector module for ECG-Streaming - connects to Polar H10 devices and streams data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ecg-common",
    "bleak>=0.22.3",
    "numpy>=2.2.0",
    "grpcio>=1.68.0",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
]

[project.scripts]
ecg-collector = "ecg_collector.main:main"
ecg-collector-cli = "ecg_collector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_collector"]
