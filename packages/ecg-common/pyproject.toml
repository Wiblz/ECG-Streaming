[project]
name = "ecg-common"
version = "0.1.0"
description = "Shared models, protocols, and utilities for ECG-Streaming"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10.3",
    "pyyaml>=6.0.2",
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "protobuf>=5.29.0",
    "protoletariat>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_common"]
