[project]
name = "ecg-simulator"
version = "0.5.0"
description = "Synthetic collector simulator for ECG-Streaming"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ecg-common",
    "grpcio>=1.68.0",
    "typer>=0.15.1",
    "rich>=13.9.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.4",
    "mypy>=1.13.0",
]

[project.scripts]
ecg-simulator = "ecg_simulator.cli:app"

[tool.uv.sources]
ecg-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_simulator"]
