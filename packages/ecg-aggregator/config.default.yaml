# ECG Aggregator Configuration

# gRPC Server (receives data from collectors)
grpc:
  port: 50051                    # gRPC server port

# Time synchronization
sync:
  window_size: 100               # Sliding window size for sync
  min_samples: 5                 # Minimum samples to calculate offset
  buffer_confidence_threshold: 0.8  # Minimum confidence to buffer samples

# HTTP/WebSocket API (serves dashboard and REST API)
api:
  port: 7999                     # HTTP/WebSocket server port
  websocket_fps: 30              # WebSocket broadcast rate (frames/sec)
  cors_origins:
    - "*"                        # CORS origins (change for production)

# Database storage
storage:
  database_path: "ecg_data.db"   # SQLite database file
  batch_size: 100                # Samples per database batch

# Data buffer
buffer:
  duration_seconds: 30           # Buffer duration (seconds)
  max_samples: 100000            # Maximum samples in buffer

# Logging
logging:
  level: "INFO"                 # DEBUG, INFO, WARNING, ERROR, CRITICAL
#  level: "DEBUG"                 # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "detailed"             # simple or detailed
  file: "/tmp/ecg-aggregator.log" # Optional log file path
