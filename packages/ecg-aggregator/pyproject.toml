[project]
name = "ecg-aggregator"
version = "0.2.0"
description = "Aggregator + Dashboard for ECG-Streaming - receives data, syncs timing, stores in DB, serves API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ecg-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.1",
    "sse-starlette>=2.1.3",
    "numpy>=2.2.0",
    "scipy>=1.15.0",
    "grpcio>=1.68.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "python-multipart>=0.0.20",
    "yoyo-migrations>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
ecg-aggregator = "ecg_aggregator.cli:main"

[tool.uv.sources]
ecg-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_aggregator"]
