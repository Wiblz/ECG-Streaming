[tool.workspace]
# Monorepo workspace configuration for ECG-Streaming project
members = [
    "packages/ecg-common",
    "packages/ecg-collector",
    "packages/ecg-aggregator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Shared tool configurations for all packages
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
exclude = [
    "^packages/ecg-common/src/ecg_common/proto/.*_pb2\\.pyi?$",
    "^packages/ecg-common/src/ecg_common/proto/.*_pb2_grpc\\.py$",
]

[[tool.mypy.overrides]]
module = "ecg_common.proto.ecg_streaming_pb2"
ignore_errors = true

[[tool.mypy.overrides]]
module = "ecg_common.proto.ecg_streaming_pb2_grpc"
ignore_errors = true

[[tool.mypy.overrides]]
module = "bleak.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "grpc.*"
ignore_missing_imports = true
