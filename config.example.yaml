# ECG Streaming Configuration Example
# Copy this file to config.yaml and customize for your setup

# BLE Configuration
ble:
  max_devices_per_adapter: 7  # Maximum devices per BLE adapter
  connection_timeout: 10.0     # Connection timeout in seconds
  reconnection_attempts: 3     # Number of reconnection attempts
  scan_duration: 5.0           # BLE scan duration in seconds

# Time Synchronization Configuration
sync:
  regression_window_size: 100  # Number of samples for regression
  min_samples_for_sync: 20     # Minimum samples before sync is ready
  confidence_threshold: 0.9    # Minimum confidence for reliable sync
  max_drift_ppm: 100.0         # Maximum acceptable clock drift in ppm

# API Server Configuration
api:
  host: "0.0.0.0"              # Server host (0.0.0.0 for all interfaces)
  port: 8000                   # Server port
  buffer_duration_seconds: 30  # Data buffer duration
  websocket_fps: 30            # WebSocket broadcast rate (frames per second)
  cors_origins:                # CORS allowed origins
    - "*"                      # Allow all origins (change for production)

# Logging Configuration
logging:
  level: "INFO"                # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "detailed"           # Log format: simple or detailed
  log_file: null               # Optional log file path (null for console only)

# Data Persistence Configuration
persistence:
  enabled: false               # Enable SQLite persistence for ECG samples
  db_path: "ecg_data.db"       # Path to SQLite database file
  batch_size: 100              # Number of samples to batch before writing
  retention_days: null         # Optional: Delete samples older than N days (null = keep forever)

# Device Configuration
# Add your Polar H10 device IDs here
# Device IDs should match the device names or addresses
device_ids:
  - "H10_ABC123"               # Example device ID
  - "H10_DEF456"               # Add more devices as needed
  # - "H10_GHI789"
  # - "H10_JKL012"

# Notes:
# - Device IDs can be found by running: ecg-cli scan
# - For 20 devices, you'll need 3 BLE adapters (7+7+6)
# - Ensure BlueZ is properly configured on your Linux system
# - Battery levels are checked periodically when devices are connected
